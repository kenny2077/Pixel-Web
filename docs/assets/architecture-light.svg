<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 988 444" width="988" height="444" role="img" aria-labelledby="title desc">
<title id="title">How Pixel Web converts a page</title>
<desc id="desc">An isolated Chromium context loads the public page and runs its scripts. Pixel Web snapshots the DOM and computed styles, converts artwork with Lanczos resampling, median-cut palettes and integer upscaling, then builds preview HTML with pixel fonts. Your browser shows that preview in an iframe that runs only Pixel Web's bridge script. Clicks, typing and scrolling are replayed on the source page, which is captured again.</desc>
<style>
@font-face{font-family:PixelifySub;src:url(data:font/woff;base64,) format('woff')}
.title{font:15px PixelifySub,monospace;fill:#1f2328}
.cap{font:600 11px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.08em;fill:#59636e}
.note{font:italic 11.5px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e}
.body{font:13px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e}
.mono{font:11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#59636e}
.flow{font:12px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e}
.accent{fill:#5b58c8}
</style>
<defs>
<marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#59636e"/></marker>
<marker id="head-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b58c8"/></marker>
</defs>
<rect x="0.5" y="0.5" width="987" height="443" fill="#ffffff" stroke="#d0d7de"/>
<rect x="14" y="16" width="208" height="412" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="28" y="40" class="cap">ISOLATED SOURCE BROWSER</text>
<text x="28" y="414" class="note">Source scripts run only here</text>
<rect x="272" y="16" width="454" height="412" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="286" y="40" class="cap">PIXEL WEB SERVER</text>
<rect x="776" y="16" width="198" height="412" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="790" y="40" class="cap">YOUR BROWSER</text>
<text x="790" y="414" class="note">Receives HTML, not source JS</text>
<rect x="34" y="64" width="176" height="54" fill="#d0d7de"/>
<rect x="30" y="60" width="176" height="54" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
<text x="44" y="86" class="title">Public URL</text>
<text x="44" y="109" class="body">public hosts only</text>
<rect x="34" y="170" width="176" height="126" fill="#d0d7de"/>
<rect x="30" y="166" width="176" height="126" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
<text x="44" y="192" class="title">Source page</text>
<text x="44" y="215" class="body">Chromium context</text>
<text x="44" y="233" class="body">runs the site's JS</text>
<text x="44" y="251" class="body">keeps its cookies</text>
<text x="44" y="279" class="mono">lib/capture.mjs</text>
<polyline points="118,114 118,164" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#head)"/>
<rect x="96.5" y="131" width="43" height="18" fill="#ffffff"/>
<text x="118" y="144" text-anchor="middle" class="flow">loads</text>
<rect x="300" y="64" width="180" height="104" fill="#d0d7de"/>
<rect x="296" y="60" width="180" height="104" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
<text x="310" y="86" class="title">Snapshot</text>
<text x="310" y="109" class="body">DOM, text, links</text>
<text x="310" y="127" class="body">computed styles</text>
<text x="310" y="151" class="mono">snapshotPage()</text>
<rect x="300" y="186" width="180" height="140" fill="#d0d7de"/>
<rect x="296" y="182" width="180" height="140" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
<text x="310" y="208" class="title">Artwork</text>
<text x="310" y="231" class="body">Lanczos resample</text>
<text x="310" y="249" class="body">median-cut palette</text>
<text x="310" y="267" class="body">integer upscale</text>
<text x="310" y="285" class="body">content-hash cache</text>
<text x="310" y="309" class="mono">lib/pixels.mjs · sharp</text>
<polyline points="206,206 247,206 247,108 294,108" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#head)"/>
<rect x="232.1" y="148" width="29.799999999999997" height="18" fill="#ffffff"/>
<text x="247" y="161" text-anchor="middle" class="flow">DOM</text>
<polyline points="206,262 294,262" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#head)"/>
<rect x="209.7" y="238" width="82.6" height="18" fill="#ffffff"/>
<text x="251" y="251" text-anchor="middle" class="flow">image bytes</text>
<rect x="530" y="126" width="184" height="124" fill="#d0d7de"/>
<rect x="526" y="122" width="184" height="124" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
<text x="540" y="148" class="title">Preview HTML</text>
<text x="540" y="171" class="body">pixel fonts, EN + CJK</text>
<text x="540" y="189" class="body">selectable text</text>
<text x="540" y="207" class="body">sanitized markup</text>
<text x="540" y="233" class="mono">lib/preview.mjs</text>
<polyline points="476,108 503,108 503,166 524,166" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#head)"/>
<polyline points="476,252 503,252 503,206 524,206" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#head)"/>
<rect x="800" y="126" width="164" height="124" fill="#d0d7de"/>
<rect x="796" y="122" width="164" height="124" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
<text x="810" y="148" class="title">Pixel preview</text>
<text x="810" y="171" class="body">iframe, strict CSP</text>
<text x="810" y="189" class="body">runs only the</text>
<text x="810" y="207" class="body">Pixel Web bridge</text>
<text x="810" y="233" class="mono">preview-client.js</text>
<polyline points="710,184 794,184" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="miter" marker-end="url(#head)"/>
<rect x="734.8" y="175" width="36.4" height="18" fill="#ffffff"/>
<text x="753" y="188" text-anchor="middle" class="flow">HTML</text>
<rect x="300" y="352" width="414" height="52" fill="#d0d7de"/>
<rect x="296" y="348" width="414" height="52" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
<text x="310" y="379" class="title">Replay on source page</text>
<text x="696" y="379" text-anchor="end" class="mono">lib/interaction.mjs</text>
<polyline points="878,250 878,374 716,374" fill="none" stroke="#5b58c8" stroke-width="2" stroke-linejoin="miter" marker-end="url(#head-accent)"/>
<text x="887" y="300" class="flow accent">click, type,</text>
<text x="887" y="316" class="flow accent">scroll</text>
<polyline points="296,374 118,374 118,298" fill="none" stroke="#5b58c8" stroke-width="2" stroke-linejoin="miter" marker-end="url(#head-accent)"/>
<text x="127" y="326" class="flow accent">same action,</text>
<text x="127" y="342" class="flow accent">then re-capture</text>
</svg>
